services:
  api:
    build: .
    container_name: panel_api
    ports: ["8080:8080"]
    volumes:
      - ./pool.json:/app/pool.json:ro
      - ./proxies.txt:/app/proxies.txt:ro
      - ./backups:/app/backups
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/metrics', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  bot:
    build: .
    container_name: panel_bot
    command: python panel_buttons.py
    depends_on: [api]
    environment:
      - TG_BOT_TOKEN=${TG_BOT_TOKEN}
      - API_BASE=http://api:8080
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: panel_prom
    ports: ["9090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on: [api]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: panel_am
    ports: ["9093:9093"]
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on: [api]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: panel_grafana
    ports: ["3000:3000"]
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASS:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on: [prometheus]
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: panel_node
    ports: ["9100:9100"]
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: panel_cadv
    ports: ["8081:8080"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    restart: unless-stopped
